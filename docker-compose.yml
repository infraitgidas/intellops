# IntellOps — Docker Compose Development Stack
# PI+D+i | Grupo GIDAS | UTN FrLP | Equipo InfraIT
#
# Recursos totales: < 2GB RAM target | CPU-only | $0/mes
# Arquitectura: 4 contenedores — ver openspec/specs/architecture/containers.md
# y docs/der/Trazabilidad DER a Contenedores.md

name: intellops

services:
  intellops-core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      - INTELLOPS_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-intellops}:${POSTGRES_PASSWORD:-intellops}@intellops-db:5432/${POSTGRES_DB:-intellops}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 250m
    depends_on:
      intellops-db:
        condition: service_healthy
    networks:
      - intellops-net

  intellops-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-intellops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-intellops}
      - POSTGRES_DB=${POSTGRES_DB:-intellops}
    volumes:
      - intellops-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellops} -d ${POSTGRES_DB:-intellops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Sin `ports:` — intellops-core es el único servicio expuesto al host.
    networks:
      - intellops-net

  intellops-ai-engine:
    build:
      context: .
      dockerfile: src/ml/Dockerfile
    environment:
      - INTELLOPS_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-intellops}:${POSTGRES_PASSWORD:-intellops}@intellops-db:5432/${POSTGRES_DB:-intellops}
    restart: unless-stopped
    mem_limit: 1000m
    depends_on:
      intellops-db:
        condition: service_healthy
    # Sin `ports:` — worker aislado, sin tráfico web (aislamiento de OOM Kill).
    networks:
      - intellops-net

  intellops-comms:
    build:
      context: .
      dockerfile: src/comms/Dockerfile
    environment:
      - INTELLOPS_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-intellops}:${POSTGRES_PASSWORD:-intellops}@intellops-db:5432/${POSTGRES_DB:-intellops}
    restart: unless-stopped
    mem_limit: 150m
    depends_on:
      intellops-db:
        condition: service_healthy
    # Sin `ports:` — solo hace llamadas salientes a proveedores de notificaciones.
    networks:
      - intellops-net

networks:
  intellops-net:
    driver: bridge

volumes:
  intellops-db-data:
