[build-system]
requires = ["setuptools>=75","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intellops"
version = "0.1.0"
description = "Sistema de Observabilidad Predictiva UX-Céntrica + AI/LLM Open-Source"
authors = [
    {name = "Equipo InfraIT — GIDAS UTN FrLP"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "flake8>=7.0.0",
    "pylint>=3.0.0",
    "pytest-asyncio>=0.25.0",
    "schemathesis>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["api"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 70

[tool.pylint.MASTER]
# Alembic genera nombres (revision, target_metadata) y usa un proxy
# dinámico (alembic.op) que pylint no puede resolver estáticamente.
ignore-paths = ["^src/api/infrastructure/db/migrations/.*$"]
