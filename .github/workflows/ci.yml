name: IntellOps CI

# Pipeline de QA (ISS-S2-04): lint → unit tests (sin DB) → suite completa con
# Postgres + reporte de cobertura. Contract, license-scan y docker corren en
# paralelo/después; la evolución (integration/build/staging/E2E) se suma acá.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push nuevo a la misma rama/PR cancela la corrida anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: flake8 (PEP 8, 0 warnings)
        run: flake8 src/ tests/
      - name: pylint (score mínimo 9.0)
        run: pylint src/ --fail-under=9.0

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Sin Postgres: los tests `unit` no tocan DB (ver tests/conftest.py).
      - run: PYTHONPATH=. pytest -m unit

  test:
    name: Unit & Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellops
          POSTGRES_PASSWORD: intellops
          POSTGRES_DB: intellops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellops -d intellops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://intellops:intellops@localhost:5432/intellops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      # Gate de cobertura (fail_under) y rutas de salida en pyproject.toml.
      - name: pytest + cobertura
        run: >-
          PYTHONPATH=. pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=reports/junit.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ ! -f .coverage ]; then
            echo "No se generó cobertura (pytest no llegó a correr)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura de tests: $(coverage report --format=total --fail-under=0)%"
            echo
            echo "Umbral mínimo: 70% (\`[tool.coverage.report] fail_under\` en pyproject.toml)."
            echo
            echo "<details><summary>Detalle por archivo</summary>"
            echo
            coverage report --format=markdown --fail-under=0
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  contract:
    name: Contract Tests (schemathesis, OpenAPI 3.1)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellops
          POSTGRES_PASSWORD: intellops
          POSTGRES_DB: intellops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellops -d intellops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://intellops:intellops@localhost:5432/intellops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      # OAS-9/ADR-24: contract layer con OpenAPI 3.1 (experimental en
      # schemathesis <4.0, nativo desde 4.0); el xfail documentado degrada
      # sin romper el gate (tests/test_contract.py).
      - run: PYTHONPATH=. pytest tests/test_contract.py -q

  license-scan:
    name: License Scan & SBOM
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx
          output-file: ./governance/sbom.json
      - run: |
          # Verificar que no haya dependencias con licencias restrictivas
          pip install pip-licenses
          pip-licenses --fail-on="SSPL;AGPL"

  docker:
    name: Docker Build
    needs: [lint, test, license-scan, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      