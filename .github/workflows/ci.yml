name: IntellOps CI

# Pipeline de QA (ISS-S2-04): lint → unit tests (sin DB) → suite completa con
# Postgres + reporte de cobertura. Contract, license-scan y docker corren en
# paralelo/después; la evolución (integration/build/staging/E2E) se suma acá.
# Dependencias fijadas en requirements/dev.lock; el job `reproducible-env`
# corre el mismo pipeline en el entorno Docker de testing (ISS-S2-05).
#
# Quality gates BLOQUEANTES (ISS-B-09, issue #71):
#   S11 — cobertura < 70 %: `--cov-fail-under=70` en el job `test`.
#   S12 — cualquier warning o error de flake8/pylint: `--fail-on=W,E` en el
#         job `lint` (con `--fail-under=9.0`, que no se baja).
#   S13 — OpenAPI/contrato inválido: `tests/test_contract.py` (schemathesis)
#         en el job `contract`, que es `needs` de `docker`.
# Ningún job ni step usa `continue-on-error`: un gate que puede fallar sin
# romper el check no es un gate. `tests/test_ci_gates.py` fija estas
# condiciones (sustituto local del PR de prueba de S14).
#
# E2E y carga (ISS-C-03, LT-1/LT-4): `e2e` corre el smoke de C.1 sobre la stack
# real en cada push/PR (bloqueante, `needs: lint`); `load` corre la carga k6 de
# la ingesta sólo a mano (`workflow_dispatch`) y sube el summary como artefacto.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # `vus`/`duration` son las entradas del escenario k6 (LT-3/LT-4): 10 VUs y
  # 1 min son la carga estándar; el job `load` las pasa a `make load`.
  workflow_dispatch:
    inputs:
      vus:
        description: "VUs de la carga estándar (LT-3: 10)"
        required: false
        default: "10"
      duration:
        description: "Duración del escenario k6 (LT-3: 1m)"
        required: false
        default: "1m"

# Un push nuevo a la misma rama/PR cancela la corrida anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      # S12: flake8 sale con código ≠ 0 ante cualquier hallazgo (E/F/W), así
      # que el step es bloqueante por sí mismo: 0 warnings, 0 errores.
      - name: flake8 (PEP 8, 0 warnings)
        run: flake8 src/ tests/
      # S12: `--fail-under` solo no alcanza (un único warning deja el score en
      # 9.9x y el job pasaría). `--fail-on=W,E` convierte cada warning o error
      # en un fallo del job; el score mínimo sigue en 9.0.
      # Sin `--disable` ni mensajes desactivados en pyproject.toml: con las
      # versiones de requirements/dev.lock el árbol pasa con 0 warnings y 0
      # errores (ISS-B-09), así que cualquier W/E nuevo falla el job.
      - name: pylint (score mínimo 9.0; W y E fallan el job)
        run: >-
          pylint src/
          --fail-under=9.0
          --fail-on=W,E

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      # Sin Postgres: los tests `unit` no tocan DB (ver tests/conftest.py).
      - run: PYTHONPATH=. pytest -m unit

  frontend:
    name: Frontend (SPA)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      # Vite 8 pide Node ≥ 22; `engines` de package.json fija ≥ 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      # S16: `npm ci` instala exactamente lo del lock (build reproducible).
      - name: Instalar dependencias (lock)
        run: npm ci
      # S19/QF-1: sin `continue-on-error`; lint, tests, build y presupuesto de
      # bundle (S17) bloquean el PR igual que los gates de Python.
      - name: eslint (0 warnings)
        run: npm run lint
      - name: Tests de componentes (Vitest)
        run: npm test
      - name: Build estático (tsc + vite)
        run: npm run build
      - name: Presupuesto de bundle (< 1 MB)
        run: npm run check-size
      - name: Navegador para el smoke E2E
        run: npx playwright install --with-deps chromium
      - name: Smoke E2E (Playwright)
        run: npm run test:e2e

  test:
    name: Unit & Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellops
          POSTGRES_PASSWORD: intellops
          POSTGRES_DB: intellops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellops -d intellops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://intellops:intellops@localhost:5432/intellops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      - run: alembic upgrade head
      # S11: `--cov-fail-under=70` es el gate explícito del job (mismo valor
      # que `[tool.coverage.report] fail_under` en pyproject.toml, que sigue
      # siendo la fuente para `make test-cov`). Si la cobertura baja de 70 %
      # pytest sale con código 2 y el job falla; no hay `continue-on-error`.
      - name: pytest + cobertura (gate 70 %)
        run: >-
          PYTHONPATH=. pytest
          --cov
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=reports/junit.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ ! -f .coverage ]; then
            echo "No se generó cobertura (pytest no llegó a correr)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura de tests: $(coverage report --format=total --fail-under=0)%"
            echo
            echo "Umbral mínimo: 70% (\`[tool.coverage.report] fail_under\` en pyproject.toml)."
            echo
            echo "<details><summary>Detalle por archivo</summary>"
            echo
            coverage report --format=markdown --fail-under=0
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  contract:
    name: Contract Tests (schemathesis, OpenAPI 3.1)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellops
          POSTGRES_PASSWORD: intellops
          POSTGRES_DB: intellops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellops -d intellops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://intellops:intellops@localhost:5432/intellops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      - run: alembic upgrade head
      # S13: un contrato OpenAPI inválido o una respuesta que no valida rompe
      # este job y, como `docker` lo tiene en `needs`, frena el flujo completo.
      # OAS-9/ADR-24: contract layer con OpenAPI 3.1 (experimental en
      # schemathesis <4.0, nativo desde 4.0); el xfail documentado degrada la
      # corrida live sin romper el gate (tests/test_contract.py).
      - name: Contract tests (schemathesis, OpenAPI 3.1)
        run: PYTHONPATH=. pytest tests/test_contract.py -q

  reproducible-env:
    name: Reproducible Test Env (Docker)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Misma versión que UV_VERSION del Makefile (`make lock`).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      # El lock debe reflejar pyproject.toml: si alguien agrega/cambia una
      # dependencia sin correr `make lock`, falla acá.
      - name: Lock al día con pyproject.toml
        run: |
          make lock
          git diff --exit-code requirements/dev.lock
      # Mismo comando que un dev o el servidor del laboratorio: `make ci`.
      - name: Pipeline en el entorno de testing
        run: make ci
      - name: Limpiar entorno
        if: always()
        run: make test-down

  license-scan:
    name: License Scan & SBOM
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx
          output-file: ./governance/sbom.json
      - run: |
          # Verificar que no haya dependencias con licencias restrictivas
          pip install pip-licenses
          pip-licenses --fail-on="SSPL;AGPL"

  docker:
    name: Docker Build
    needs: [lint, test, license-scan, contract]
    runs-on: ubuntu-latest
    env:
      # ISS-C-05: el compose exige JWT_SECRET (sin default público), incluso
      # para `build`. Valor solo de CI: nunca firma tokens fuera del runner.
      JWT_SECRET: ci-only-jwt-secret-not-for-deploy-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  # ISS-C-03 (LT-1, D1): el smoke E2E de C.1 sobre la stack real. Es el único
  # gate que ve el compose completo —build, migraciones, colas y ciclos de los
  # workers—: una rotura del camino real no la ven los tests con ASGI. Corre los
  # mismos pasos que `make e2e-ci`, inline (sin depender de targets), con los
  # intervalos de los workers en 5 s y el perfil `smoke`. Sin
  # `continue-on-error`: un flujo roto frena el PR. Coste ~3-4 min de build +
  # ~15 s de flujo; `needs: lint` evita gastarlo si el código ni siquiera lintea.
  e2e:
    name: E2E (smoke completo)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # ISS-C-05: el compose exige JWT_SECRET; valor solo de CI. Cubre todos
      # los steps, incluidos `ps`, `logs` y `down`, que también interpolan.
      JWT_SECRET: ci-only-jwt-secret-not-for-deploy-0123456789abcdef
      INTELLOPS_RULES_INTERVAL_SECONDS: "5"
      INTELLOPS_COMMS_INTERVAL_SECONDS: "5"
      INTELLOPS_COMMS_TELEGRAM_BOT_TOKEN: smoke-token
      INTELLOPS_COMMS_TELEGRAM_CHAT_ID: smoke-chat
      INTELLOPS_COMMS_TELEGRAM_API_BASE: http://intellops-telegram-stub:8099
    steps:
      - uses: actions/checkout@v4
      # Mismo `up` que `make smoke`: la primera vez construye las tres imágenes.
      - name: Levantar la stack (perfil smoke, intervalos de 5 s)
        run: docker compose --profile smoke up -d --build
      # El script falla nombrando la etapa (health, login, app, ingesta, lectura,
      # regla, alerta, notificación): su salida es el diagnóstico del job.
      - name: Smoke E2E (scripts/smoke.py)
        run: |
          mkdir -p reports
          python3 scripts/smoke.py 2>&1 | tee reports/smoke.log
      # Sin este dump, un rojo del smoke no dice nada sobre la causa del lado
      # del servidor (migración, worker o cola).
      - name: Logs de la stack (si falló)
        if: failure()
        run: |
          mkdir -p reports
          docker compose --profile smoke ps --all > reports/compose-ps.txt 2>&1 || true
          docker compose --profile smoke logs --no-color > reports/compose-logs.txt 2>&1 || true
      - name: Publicar la salida del smoke y los logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Bajar la stack
        if: always()
        run: docker compose --profile smoke down -v

  # ISS-C-03 (LT-4, D6): carga estándar de la ingesta. Manual a propósito: en
  # cada PR duplicaría el coste del job `e2e` sin agregar señal (la latencia de
  # un runner compartido no es comparable entre corridas). Se corre cuando se
  # toca ingesta o infraestructura; ahí el umbral p95 ≤ 500 ms y el < 1 % de
  # errores son el criterio. `make load` corre k6 en la imagen pinneada dentro
  # de la red del compose y deja el summary en reports/ (ignorado por git).
  load:
    name: Carga k6 (ingesta)
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # ISS-C-05: el compose exige JWT_SECRET; valor solo de CI (también lo
      # necesita `make load`, que resuelve la red con `docker compose ps`).
      JWT_SECRET: ci-only-jwt-secret-not-for-deploy-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la stack
        run: docker compose up -d --build
      # El escenario es contra la API real: sin /health en verde no hay nada que
      # medir (y `make load` necesita los contenedores para resolver la red).
      - name: Esperar la API (/health)
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API arriba en el intento $attempt"
              exit 0
            fi
            sleep 2
          done
          echo "la API no respondió /health en 120 s"
          docker compose logs intellops-core
          exit 1
      - name: Carga estándar (make load)
        run: make load VUS=${{ inputs.vus }} DURATION=${{ inputs.duration }}
      # Se sube siempre: si un umbral se cruza, el summary es justamente la
      # evidencia que hay que mirar (p95, tasa de error, checks).
      - name: Publicar el summary de k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: reports/k6-summary.json
          if-no-files-found: ignore
          retention-days: 14
      