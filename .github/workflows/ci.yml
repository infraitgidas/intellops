name: IntellOps CI

# Pipeline de QA (ISS-S2-04): lint → unit tests (sin DB) → suite completa con
# Postgres + reporte de cobertura. Contract, license-scan y docker corren en
# paralelo/después; la evolución (integration/build/staging/E2E) se suma acá.
# Dependencias fijadas en requirements/dev.lock; el job `reproducible-env`
# corre el mismo pipeline en el entorno Docker de testing (ISS-S2-05).
#
# Quality gates BLOQUEANTES (ISS-B-09, issue #71):
#   S11 — cobertura < 70 %: `--cov-fail-under=70` en el job `test`.
#   S12 — cualquier warning o error de flake8/pylint: `--fail-on=W,E` en el
#         job `lint` (con `--fail-under=9.0`, que no se baja).
#   S13 — OpenAPI/contrato inválido: `tests/test_contract.py` (schemathesis)
#         en el job `contract`, que es `needs` de `docker`.
# Ningún job ni step usa `continue-on-error`: un gate que puede fallar sin
# romper el check no es un gate. `tests/test_ci_gates.py` fija estas
# condiciones (sustituto local del PR de prueba de S14).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push nuevo a la misma rama/PR cancela la corrida anterior en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      # S12: flake8 sale con código ≠ 0 ante cualquier hallazgo (E/F/W), así
      # que el step es bloqueante por sí mismo: 0 warnings, 0 errores.
      - name: flake8 (PEP 8, 0 warnings)
        run: flake8 src/ tests/
      # S12: `--fail-under` solo no alcanza (un único warning deja el score en
      # 9.9x y el job pasaría). `--fail-on=W,E` convierte cada warning o error
      # en un fallo del job; el score mínimo sigue en 9.0.
      # Sin `--disable` ni mensajes desactivados en pyproject.toml: con las
      # versiones de requirements/dev.lock el árbol pasa con 0 warnings y 0
      # errores (ISS-B-09), así que cualquier W/E nuevo falla el job.
      - name: pylint (score mínimo 9.0; W y E fallan el job)
        run: >-
          pylint src/
          --fail-under=9.0
          --fail-on=W,E

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      # Sin Postgres: los tests `unit` no tocan DB (ver tests/conftest.py).
      - run: PYTHONPATH=. pytest -m unit

  test:
    name: Unit & Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellops
          POSTGRES_PASSWORD: intellops
          POSTGRES_DB: intellops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellops -d intellops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://intellops:intellops@localhost:5432/intellops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      - run: alembic upgrade head
      # S11: `--cov-fail-under=70` es el gate explícito del job (mismo valor
      # que `[tool.coverage.report] fail_under` en pyproject.toml, que sigue
      # siendo la fuente para `make test-cov`). Si la cobertura baja de 70 %
      # pytest sale con código 2 y el job falla; no hay `continue-on-error`.
      - name: pytest + cobertura (gate 70 %)
        run: >-
          PYTHONPATH=. pytest
          --cov
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --junitxml=reports/junit.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ ! -f .coverage ]; then
            echo "No se generó cobertura (pytest no llegó a correr)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Cobertura de tests: $(coverage report --format=total --fail-under=0)%"
            echo
            echo "Umbral mínimo: 70% (\`[tool.coverage.report] fail_under\` en pyproject.toml)."
            echo
            echo "<details><summary>Detalle por archivo</summary>"
            echo
            coverage report --format=markdown --fail-under=0
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  contract:
    name: Contract Tests (schemathesis, OpenAPI 3.1)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intellops
          POSTGRES_PASSWORD: intellops
          POSTGRES_DB: intellops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellops -d intellops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://intellops:intellops@localhost:5432/intellops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Instalar dependencias (lock)
        run: |
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      - run: alembic upgrade head
      # S13: un contrato OpenAPI inválido o una respuesta que no valida rompe
      # este job y, como `docker` lo tiene en `needs`, frena el flujo completo.
      # OAS-9/ADR-24: contract layer con OpenAPI 3.1 (experimental en
      # schemathesis <4.0, nativo desde 4.0); el xfail documentado degrada la
      # corrida live sin romper el gate (tests/test_contract.py).
      - name: Contract tests (schemathesis, OpenAPI 3.1)
        run: PYTHONPATH=. pytest tests/test_contract.py -q

  reproducible-env:
    name: Reproducible Test Env (Docker)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Misma versión que UV_VERSION del Makefile (`make lock`).
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      # El lock debe reflejar pyproject.toml: si alguien agrega/cambia una
      # dependencia sin correr `make lock`, falla acá.
      - name: Lock al día con pyproject.toml
        run: |
          make lock
          git diff --exit-code requirements/dev.lock
      # Mismo comando que un dev o el servidor del laboratorio: `make ci`.
      - name: Pipeline en el entorno de testing
        run: make ci
      - name: Limpiar entorno
        if: always()
        run: make test-down

  license-scan:
    name: License Scan & SBOM
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx
          output-file: ./governance/sbom.json
      - run: |
          # Verificar que no haya dependencias con licencias restrictivas
          pip install pip-licenses
          pip-licenses --fail-on="SSPL;AGPL"

  docker:
    name: Docker Build
    needs: [lint, test, license-scan, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      