openapi: 3.1.0
info:
  title: IntellOps API Contracts
  version: 1.0.0
  description: Contratos versionados de la API de IntellOps - Sprint 1
servers:
  - url: http://localhost:8000
    description: Servidor de desarrollo local
paths:
  /health:
    get:
      summary: Health check del sistema
      operationId: healthCheck
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness check (dependencias listas)
      operationId: readinessCheck
      responses:
        '200':
          description: Ready
  /metrics/ingest:
    post:
      summary: Ingesta de eventos RUM
      operationId: ingestMetrics
      description: "Recibe un lote de eventos RUM del agente de frontend. Siempre se envía en batch."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RumEventBatch'
      responses:
        '202':
          description: "Eventos RUM aceptados para procesamiento"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: "Payload inválido (schema validation error)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Rate limit excedido"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: "Cola de ingesta llena (backpressure)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /logs/ingest:
    post:
      summary: Ingesta de excepciones JavaScript
      operationId: ingestJsExceptions
      description: "Recibe un lote de excepciones JavaScript capturadas por el agente RUM. Siempre se envía en batch."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsExceptionBatch'
      responses:
        '202':
          description: "Excepciones aceptadas para procesamiento"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: "Payload inválido (schema validation error)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Rate limit excedido"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: "Cola de ingesta llena (backpressure)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /metrics/query:
    get:
      summary: Consulta de métricas históricas
      operationId: queryMetrics
      responses:
        '200':
          description: Lista de métricas históricas
  /metrics/list:
    get:
      summary: Listado de métricas disponibles
      operationId: listMetrics
      responses:
        '200':
          description: Listado de métricas disponibles
  /anomalies:
    get:
      summary: Listado de anomalías detectadas
      operationId: listAnomalies
      responses:
        '200':
          description: Listado de anomalías
  /anomalies/{id}:
    get:
      summary: Detalle de una anomalía específica
      operationId: getAnomaly
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la anomalía
  /predictions:
    get:
      summary: Predicciones actuales
      operationId: listPredictions
      responses:
        '200':
          description: Predicciones actuales
  /predictions/forecast:
    get:
      summary: Forecasting conversacional
      operationId: forecastPredictions
      responses:
        '200':
          description: Forecasting conversacional
  /alerts:
    get:
      summary: Listado de alertas
      operationId: listAlerts
      responses:
        '200':
          description: Listado de alertas
  /alerts/config:
    post:
      summary: Configurar regla de alerta
      operationId: configAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule:
                  type: string
                  description: "Regla de alerta"
                condition:
                  type: object
                  description: "Condición de la alerta"
      responses:
        '200':
          description: Regla configurada
  /alerts/{id}/ack:
    put:
      summary: Acknowledge de alerta
      operationId: ackAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Alert acknowledged
  /dashboard/summary:
    get:
      summary: Resumen para dashboard principal
      operationId: dashboardSummary
      responses:
        '200':
          description: Resumen para dashboard
  /dashboard/heatmap:
    get:
      summary: Datos para mapa de calor
      operationId: dashboardHeatmap
      responses:
        '200':
          description: Datos para mapa de calor
  /assistant/query:
    post:
      summary: Consulta al asistente GenIA
      operationId: assistantQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: "Consulta en lenguaje natural"
                context:
                  type: object
                  properties:
                    timeRange:
                      type: string
                      description: "Rango temporal (ej: 'last 30m')"
                    metricFilter:
                      type: array
                      items:
                        type: string
      responses:
        '200':
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponse'
        '429':
          description: "LLM ocupado, reintentar"
  /admin/config:
    get:
      summary: Configuración del sistema
      operationId: getAdminConfig
      responses:
        '200':
          description: Configuración del sistema
    put:
      summary: Actualizar configuración
      operationId: updateAdminConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: "Clave de configuración"
                value:
                  type: string
                  description: "Valor de la configuración"
      responses:
        '200':
          description: Configuración actualizada
  /admin/status:
    get:
      summary: Estado del sistema
      operationId: getAdminStatus
      responses:
        '200':
          description: Estado del sistema
  /auth/login:
    post:
      summary: Autentica email+password y emite el JWT
      operationId: login
      description: "Público (sin security). Devuelve access_token JWT HS256 (expiración 30 min) y actualiza last_login."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: "JSON malformado (error al parsear el body)"
        '401':
          description: "Credenciales inválidas (anti-enumeración: email desconocido, password incorrecta o sin password_hash)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Payload inválido (schema validation error)"
  /auth/logout:
    post:
      summary: Cierra la sesión del cliente (stateless)
      operationId: logout
      description: "Requiere bearer. El servidor no persiste estado; el cliente descarta el token."
      security:
        - bearerAuth: []
      responses:
        '204':
          description: "Sesión cerrada sin cuerpo"
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Usuario del token inactivo (ADR-15: fuerza re-login)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users:
    get:
      summary: Lista usuarios
      operationId: listUsers
      description: "Requiere bearer (Admin o Researcher). Nunca expone password_hash."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRead'
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crea un usuario
      operationId: createUser
      description: "Requiere bearer (solo Admin). Hashea password con argon2 (pwdlib)."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: "JSON malformado (error al parsear el body)"
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso (solo Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Email duplicado o role_id inexistente (FK)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Payload inválido (schema validation error)"
  /users/{user_id}:
    get:
      summary: Detalle de un usuario
      operationId: getUser
      description: "Requiere bearer (Admin o Researcher). Nunca expone password_hash."
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "user_id no es un UUID válido (path parameter validation error)"
    put:
      summary: Actualiza un usuario
      operationId: updateUser
      description: "Requiere bearer (solo Admin). Re-hashea password solo si se envía."
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: "JSON malformado (error al parsear el body)"
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso (solo Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Email duplicado o role_id inexistente (FK)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Payload o user_id inválido (schema/path validation error)"
  /applications:
    get:
      summary: Lista aplicaciones
      operationId: listApplications
      description: "Requiere bearer (Admin o Researcher)."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de aplicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crea una aplicación
      operationId: createApplication
      description: "Requiere bearer (solo Admin). api_token_hash queda null (columna dormida hasta S2-02)."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Aplicación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '400':
          description: "JSON malformado (error al parsear el body)"
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso (solo Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Payload inválido (schema validation error)"
  /applications/{application_id}:
    get:
      summary: Detalle de una aplicación
      operationId: getApplication
      description: "Requiere bearer (Admin o Researcher)."
      security:
        - bearerAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la aplicación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Aplicación inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "application_id no es un UUID válido (path parameter validation error)"
    put:
      summary: Actualiza una aplicación
      operationId: updateApplication
      description: "Requiere bearer (solo Admin)."
      security:
        - bearerAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Aplicación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRead'
        '400':
          description: "JSON malformado (error al parsear el body)"
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso (solo Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Aplicación inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "Payload o application_id inválido (schema/path validation error)"
    delete:
      summary: Elimina una aplicación
      operationId: deleteApplication
      description: "Requiere bearer (solo Admin). 409 si la FK RESTRICT de user_session.app_id lo impide."
      security:
        - bearerAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Aplicación eliminada sin cuerpo
        '401':
          description: "Bearer ausente, malformado, expirado o de firma inválida"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Usuario inactivo o sin permiso (solo Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Aplicación inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Aplicación con user_session asociadas (FK RESTRICT)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: "application_id no es un UUID válido (path parameter validation error)"
components:
  schemas:
    RumEventBatch:
      type: object
      required: [schema_version, events]
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
          description: "Versión del contrato de ingesta RUM"
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/RumEvent'
          description: "Eventos RUM incluidos en el lote"
    RumEvent:
      type: object
      required: [schema_version, timestamp, session_id, application_id, metrics]
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
          description: "Versión del contrato de ingesta RUM"
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 UTC - ventana de captura del evento"
        session_id:
          type: string
          format: uuid
          description: "Identificador de la sesión de usuario"
        application_id:
          type: string
          format: uuid
          description: "Identificador de la aplicación que origina el evento"
        metrics:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RumMetric'
          description: "Métricas RUM capturadas en el evento"
        metadata:
          type: object
          description: "Contexto opcional del evento"
          properties:
            page_url:
              type: string
              description: "URL de la página donde se capturó el evento"
            user_agent:
              type: string
              description: "User agent del navegador"
            viewport:
              type: object
              description: "Dimensiones de la ventana del navegador"
              properties:
                width:
                  type: integer
                  description: "Ancho en píxeles"
                height:
                  type: integer
                  description: "Alto en píxeles"
            connection:
              type: object
              description: "Información de conexión del usuario (ej: effectiveType)"
              additionalProperties: true
    RumMetric:
      type: object
      required: [type, value, unit]
      properties:
        type:
          type: string
          enum: [TTFB, FCP, XHR_LATENCY, JS_EXCEPTION_RATE, RAGE_CLICK]
          description: "Tipo de métrica RUM"
        value:
          type: number
          minimum: 0
          description: "ms para TTFB/FCP/XHR_LATENCY; count para JS_EXCEPTION_RATE/RAGE_CLICK"
        unit:
          type: string
          enum: [ms, count]
          description: "Unidad de medida del valor"
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 UTC - opcional, por defecto usa el timestamp del envelope"
        page_url:
          type: string
          description: "URL de la página asociada a la métrica"
        metadata:
          type: object
          description: "Contexto opcional de la métrica (ej: XHR con method, url, status; rage_click con target_selector, click_count)"
          additionalProperties: true
    JsExceptionBatch:
      type: object
      required: [schema_version, events]
      properties:
        schema_version:
          type: string
          enum: ["1.0"]
          description: "Versión del contrato de ingesta de excepciones"
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/JsExceptionEvent'
          description: "Excepciones JavaScript incluidas en el lote"
    JsExceptionEvent:
      type: object
      required: [error_type, message, session_id, application_id, timestamp]
      properties:
        error_type:
          type: string
          maxLength: 100
          description: "Tipo de error (ej: TypeError, ReferenceError, RangeError, UnhandledRejection, Other)"
        message:
          type: string
          maxLength: 2000
          description: "Mensaje del error"
        stack_trace:
          type: string
          maxLength: 20000
          description: "Stack trace del error, opcional"
        session_id:
          type: string
          format: uuid
          description: "Identificador de la sesión de usuario"
        application_id:
          type: string
          format: uuid
          description: "Identificador de la aplicación; necesario para resolver/crear la sesión en el ingest"
        metric_id:
          type: string
          format: uuid
          description: "Referencia opcional a la métrica RUM asociada (FK nullable, ON DELETE SET NULL)"
        timestamp:
          type: string
          format: date-time
          description: "ISO 8601 UTC - momento de captura de la excepción"
    IngestResponse:
      type: object
      required: [batch_id, accepted, rejected]
      properties:
        batch_id:
          type: string
          format: uuid
          description: "Identificador del batch generado por el servidor (correlación; no se persiste en S1)"
        accepted:
          type: integer
          minimum: 0
          description: "Cantidad de eventos aceptados para procesamiento"
        rejected:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index:
                type: integer
                minimum: 0
                description: "Posición del evento rechazado dentro del batch"
              reason:
                type: string
                description: "Código de rechazo (unknown_metric_type, invalid_range, ...)"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "Código de error (schema_validation_error, rate_limit_exceeded, queue_full, ...)"
            message:
              type: string
              description: "Descripción legible del error"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          description: "Email del usuario (dominio con punto, ej. user@lab.dev)"
        password:
          type: string
          description: "Password del usuario"
    AuthResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: "JWT HS256 con claims sub, role, iat, exp e iss"
        token_type:
          type: string
          enum: ["bearer"]
          description: "Tipo de token (siempre bearer)"
        expires_in:
          type: integer
          description: "Segundos de validez del token (default 1800)"
    UserCreate:
      type: object
      required: [name, email, password, role_id]
      properties:
        name:
          type: string
          description: "Nombre del usuario"
        email:
          type: string
          format: email
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          description: "Email del usuario (único; dominio con punto)"
        password:
          type: string
          minLength: 8
          description: "Password en texto plano; se hashea con argon2"
        role_id:
          type: integer
          description: "FK a user_role (Admin o Researcher)"
    UserUpdate:
      type: object
      properties:
        name:
          type: [string, "null"]
          description: "Nombre del usuario (null = no se actualiza)"
        email:
          type: [string, "null"]
          format: email
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          description: "Email del usuario (único; null = no se actualiza; dominio con punto)"
        password:
          type: [string, "null"]
          minLength: 8
          description: "Solo re-hashea cuando se envía"
        is_active:
          type: [boolean, "null"]
          description: "Estado activo del usuario (null = no se actualiza)"
        role_id:
          type: [integer, "null"]
          description: "FK a user_role (null = no se actualiza)"
    UserRead:
      type: object
      required: [user_id, name, email, role_id, is_active, created_at]
      properties:
        user_id:
          type: string
          format: uuid
          description: "Identificador del usuario"
        name:
          type: string
          description: "Nombre del usuario"
        email:
          type: string
          description: "Email del usuario"
        role_id:
          type: integer
          description: "FK a user_role"
        is_active:
          type: boolean
          description: "Estado activo del usuario"
        last_login:
          type: [string, "null"]
          format: date-time
          description: "Último login exitoso (null si nunca logueó)"
        created_at:
          type: string
          format: date-time
          description: "Momento de creación"
    ApplicationCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: "Nombre de la aplicación (no vacío)"
        description:
          type: [string, "null"]
          description: "Descripción opcional de la aplicación"
    ApplicationUpdate:
      type: object
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          description: "Nombre de la aplicación (no vacío; null = no se actualiza)"
        description:
          type: [string, "null"]
          description: "Descripción opcional de la aplicación (null = no se actualiza)"
    ApplicationRead:
      type: object
      required: [app_id, name, description, api_token_hash, created_at]
      properties:
        app_id:
          type: string
          format: uuid
          description: "Identificador de la aplicación"
        name:
          type: string
          description: "Nombre de la aplicación"
        description:
          type: [string, "null"]
          description: "Descripción opcional de la aplicación"
        api_token_hash:
          type: [string, "null"]
          description: "Columna dormida en S2-01: siempre null (ADR-16); se retira de respuestas en S2-02"
        created_at:
          type: string
          format: date-time
          description: "Momento de creación"
    AssistantResponse:
      type: object
      properties:
        response:
          type: string
          description: "Respuesta del asistente en lenguaje natural"
        root_cause:
          type: string
          description: "Causa raíz identificada"
        recommended_actions:
          type: array
          items:
            type: string
            description: "Acciones recomendadas"
    Anomaly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        metric_name:
          type: string
        detected_at:
          type: string
          format: date-time
        score:
          type: number
          description: "Puntaje de anomalía (0-1), > 0.8 es anómalo"
        severity:
          type: string
          enum: [low, medium, high, critical]
        detector:
          type: string
          enum: [isolation_forest, zscore, seasonal, ensemble]
        description:
          type: string
        metrics_snapshot:
          type: object
          description: "Métrica y ventana temporal del contexto"
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [pending, sent, failed]
        sent_at:
          type: string
          format: date-time
          description: "Cuándo se despachó la alerta"
        created_at:
          type: string
          format: date-time
          description: "Cuándo se creó la alerta"
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  x-tag:
    name: Public
    description: Endpoints públicos o con auth menor
    externalDocs:
      description: Documentación completa
      url: https://github.com/infraitgidas/intellops